# Example schema - User service

type User implements Node {
  id: ID!
  email: String!
  username: String!
  firstName: String
  lastName: String
  avatar: String
  role: UserRole!
  status: UserStatus!
  createdAt: DateTime!
  updatedAt: DateTime!
  lastLoginAt: DateTime
}

type UserConnection {
  edges: [UserEdge!]!
  pageInfo: PageInfo!
}

type UserEdge {
  node: User!
  cursor: String!
}

enum UserRole {
  ADMIN
  USER
  GUEST
}

enum UserStatus {
  ACTIVE
  INACTIVE
  SUSPENDED
  DELETED
}

input CreateUserInput {
  email: String!
  username: String!
  password: String!
  firstName: String
  lastName: String
  role: UserRole = USER
}

input UpdateUserInput {
  email: String
  username: String
  firstName: String
  lastName: String
  avatar: String
}

input UserFilterInput {
  email: String
  username: String
  role: UserRole
  status: UserStatus
  search: String
}

type CreateUserResponse implements MutationResponse {
  success: Boolean!
  message: String
  errors: [Error!]
  user: User
}

type UpdateUserResponse implements MutationResponse {
  success: Boolean!
  message: String
  errors: [Error!]
  user: User
}

type DeleteUserResponse implements MutationResponse {
  success: Boolean!
  message: String
  errors: [Error!]
}

extend type Query {
  """Get user by ID"""
  user(id: ID!): User
  
  """Get current authenticated user"""
  me: User
  
  """List users with pagination and filtering"""
  users(
    pagination: PaginationInput
    filter: UserFilterInput
    sort: SortInput
  ): UserConnection!
}

extend type Mutation {
  """Create a new user"""
  createUser(input: CreateUserInput!): CreateUserResponse!
  
  """Update an existing user"""
  updateUser(id: ID!, input: UpdateUserInput!): UpdateUserResponse!
  
  """Delete a user"""
  deleteUser(id: ID!): DeleteUserResponse!
}

extend type Subscription {
  """Subscribe to user updates"""
  userUpdated(userId: ID): User!
  
  """Subscribe to new users"""
  userCreated: User!
}
