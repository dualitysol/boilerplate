type Product {
  id: ID!
  name: String!
  description: String
  price: Float!
  stock: Int!
  category: String!
  tags: [String!]
  createdAt: String!
  updatedAt: String!
}

input CreateProductInput {
  name: String!
  description: String
  price: Float!
  stock: Int!
  category: String!
  tags: [String!]
}

input UpdateProductInput {
  name: String
  description: String
  price: Float
  stock: Int
  category: String
  tags: [String!]
}

type ProductResponse {
  success: Boolean!
  message: String
  product: Product
}

type ProductListResponse {
  success: Boolean!
  message: String
  products: [Product!]
  total: Int
}

type Query {
  products(category: String, minPrice: Float, maxPrice: Float, limit: Int, offset: Int): ProductListResponse!
  product(id: ID!): ProductResponse!
  searchProducts(query: String!, limit: Int): ProductListResponse!
}

type Mutation {
  createProduct(input: CreateProductInput!): ProductResponse!
  updateProduct(id: ID!, input: UpdateProductInput!): ProductResponse!
  deleteProduct(id: ID!): ProductResponse!
  updateStock(id: ID!, quantity: Int!): ProductResponse!
}
